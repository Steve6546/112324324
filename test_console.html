<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Console Buttons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-white">
    <div class="fixed inset-0 bg-[#09090b] flex flex-col z-40 font-sans text-white overflow-hidden">
        <header class="h-12 border-b border-white/10 bg-[#09090b] flex items-center justify-between px-4 shrink-0 z-50">
            <div class="flex items-center gap-4">
                <button class="p-1.5 hover:bg-white/10 rounded-md text-gray-400 hover:text-white transition-colors">
                    ←
                </button>
                <div class="flex items-center gap-2 select-none">
                    <span class="text-sm font-semibold text-gray-200">Test Project</span>
                    <span class="text-xs text-gray-600 px-2 py-0.5 border border-white/5 rounded-full">v1.0</span>
                </div>
            </div>

            <!-- Center Tabs -->
            <div class="flex bg-[#18181b] rounded-md p-1 border border-white/5">
                <button class="flex items-center gap-2 px-3 py-1 rounded text-xs font-medium transition-all text-gray-400 hover:text-gray-200">
                    <span>⚡</span> Code
                </button>
                <button class="flex items-center gap-2 px-3 py-1 rounded text-xs font-medium transition-all text-gray-400 hover:text-gray-200">
                    <span>▶</span> Preview
                </button>
                <button class="flex items-center gap-2 px-3 py-1 rounded text-xs font-medium transition-all bg-[#27272a] text-white shadow-sm">
                    <span>⚠</span> Console
                    <span class="bg-red-500 text-white text-xs px-1 rounded-full min-w-[16px] h-4 flex items-center justify-center">1</span>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button class="p-1.5 text-gray-400 hover:text-white hover:bg-white/10 rounded-md">💾</button>
                <button class="px-3 py-1.5 rounded-md text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white transition-colors flex items-center gap-2 shadow-sm">
                    <span>⬇</span> Export
                </button>
            </div>
        </header>

        <div class="text-center py-8">
            <p>This shows the header with the three tab buttons: Code, Preview, Console</p>
            <p>The Console button shows "Console 1" when there are console logs</p>
        </div>
    </div>
</body>
</html>
